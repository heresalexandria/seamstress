name: Build check
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      target:
        description: Native macOS architecture to package
        type: choice
        options: [all, arm64, x64]
        default: all
permissions:
  contents: read
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.targets.outputs.architectures }}
    steps:
      - id: targets
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          case "$TARGET" in
            all) echo 'architectures=["arm64","x64"]' >> "$GITHUB_OUTPUT" ;;
            arm64) echo 'architectures=["arm64"]' >> "$GITHUB_OUTPUT" ;;
            x64) echo 'architectures=["x64"]' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
  build:
    name: unsigned development build, mac-${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.architectures) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build native development package
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npm run package:backend
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Test the packaged application, including export
        working-directory: app
        run: |
          executable="$(find "$PWD/release" -path '*/Seamstress.app/Contents/MacOS/Seamstress' -type f -print -quit)"
          test -n "$executable"
          SEAMSTRESS_TEST_APP="$executable" npm run test:e2e
      - name: Attach development installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-build-check-mac-${{ matrix.arch }}
          path: |
            app/release/*.dmg
            app/release/*.zip
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
      - name: Attach diagnostics on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: build-check-diagnostics-${{ matrix.arch }}
          path: |
            output/app-ui-smoke/
            build/backend/pyinstaller.log
          retention-days: 7
