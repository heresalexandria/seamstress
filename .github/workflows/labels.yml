name: Create release labels
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the release labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create major --color d73a4a --description 'Release a breaking change' --force
          gh label create minor --color 1aa9a1 --description 'Release a new feature' --force
          gh label create patch --color c74aa5 --description 'Release a fix or small change' --force
          gh label create no-release --color 6e7781 --description 'Merge without publishing a new app' --force
