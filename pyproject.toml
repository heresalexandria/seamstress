[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seamstress-video"
version = "0.5.0"
description = "Refine continuity seams in AI-generated oners while preserving original frames."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=10",
  "opencv-python-headless>=4.8",
  "scikit-image>=0.21",
]

[project.scripts]
seamstress = "seamstress.cli:main"

[tool.setuptools.packages.find]
include = ["seamstress*"]

[project.optional-dependencies]
bridge = ["torch>=2.2"]
segmentation = ["onnxruntime==1.23.2"]

[tool.setuptools.package-data]
"seamstress" = ["resources/*.txt"]
"seamstress._vendor.rife" = ["LICENSE", "provenance.json"]
